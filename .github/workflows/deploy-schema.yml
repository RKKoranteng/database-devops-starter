# Applies the schema changelog (schema/changelog.yaml) to the application database with Liquibase.
# Every run starts with the Lint schema workflow; nothing is applied unless lint passes.
#
# pull_request:                         lint, then on a throwaway Postgres: update, rollback, update again,
#                                       then the test cases in schema/tests.
# workflow_dispatch, target=ephemeral:  same as pull_request.
# workflow_dispatch, target=instance:   lint, then show pending changesets and update a real instance,
#                                       using the chosen GitHub environment's secrets.
#                                       Run the Bootstrap database workflow first so the database and owner role exist.
#
# Environment secrets required for target=instance:
#   DB_HOST, DB_PORT, DB_OWNER_PASSWORD
name: Deploy schema

on:
  pull_request:
    paths:
      - "schema/**"
      - "pipelines/bin/**"
      - "pipelines/test/**"
      - ".github/workflows/deploy-schema.yml"
      - ".github/workflows/lint-schema.yml"
  workflow_dispatch:
    inputs:
      target:
        description: "ephemeral = throwaway Postgres container, instance = real instance from the environment's secrets"
        type: choice
        options:
          - ephemeral
          - instance
        default: ephemeral
      environment:
        description: "GitHub environment holding the target instance's secrets (target=instance only)"
        required: true
        default: dev
      db_name:
        description: "Database to apply the schema to (target=instance only)"
        required: true
        default: app_db
      db_owner:
        description: "Role Liquibase connects as (target=instance only)"
        required: true
        default: app_user

env:
  LIQUIBASE_IMAGE: liquibase/liquibase:4.29

jobs:
  lint:
    name: Lint
    uses: ./.github/workflows/lint-schema.yml

  validate:
    name: Test on throwaway Postgres
    needs: lint
    if: github.event_name == 'pull_request' || inputs.target == 'ephemeral'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: app_db
          POSTGRES_USER: app_user
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Read by pipelines/bin/liquibase
      DB_HOST: localhost
      DB_NAME: app_db
      DB_USER: app_user
      DB_PASSWORD: ci_only_password
      # Read by psql
      PGHOST: localhost
      PGDATABASE: app_db
      PGUSER: app_user
      PGPASSWORD: ci_only_password
    steps:
      - uses: actions/checkout@v4

      - name: Set up Liquibase
        run: |
          chmod +x pipelines/bin/liquibase
          echo "$GITHUB_WORKSPACE/pipelines/bin" >> "$GITHUB_PATH"
          docker pull --quiet "$LIQUIBASE_IMAGE"

      - name: "1. Update: apply every changeset"
        id: update
        run: |
          liquibase update
          applied=$(psql -tAc "SELECT count(*) FROM databasechangelog")
          echo "applied=$applied" >> "$GITHUB_OUTPUT"
          echo "Applied $applied changesets"

      - name: "2. Rollback: undo every changeset"
        id: rollback
        run: |
          liquibase rollback-count --count=${{ steps.update.outputs.applied }}

          # Rolling everything back must leave an empty schema: no changesets recorded,
          # and no tables, views, indexes, sequences or routines left behind.
          remaining=$(psql -tAc "SELECT count(*) FROM databasechangelog")
          leftovers=$(psql -tAc "
            SELECT string_agg(name, ', ') FROM (
              SELECT c.relname AS name FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace
              WHERE n.nspname = 'public' AND c.relname NOT LIKE 'databasechangelog%'
              UNION ALL
              SELECT p.proname FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
              WHERE n.nspname = 'public'
            ) objects")
          if [ "$remaining" != 0 ] || [ -n "$leftovers" ]; then
            echo "::error::Rollback left $remaining changesets recorded and these objects behind: ${leftovers:-none}"
            exit 1
          fi
          echo "Rolled back ${{ steps.update.outputs.applied }} changesets; the schema is empty again"

      - name: "3. Update again: re-apply after rollback"
        id: reapply
        run: |
          liquibase update
          applied=$(psql -tAc "SELECT count(*) FROM databasechangelog")
          if [ "$applied" != "${{ steps.update.outputs.applied }}" ]; then
            echo "::error::Re-applied $applied changesets, expected ${{ steps.update.outputs.applied }}"
            exit 1
          fi
          echo "Re-applied $applied changesets"

      - name: "4. Tests: run every test case in schema/tests"
        id: tests
        run: bash pipelines/test/run-sql-tests.sh

      - name: Summary
        if: always()
        run: |
          {
            echo "### Test on throwaway Postgres"
            echo "| Step | Result |"
            echo "|---|---|"
            echo "| Lint | ${{ needs.lint.result }} (risk level: ${{ needs.lint.outputs.risk-level }}) |"
            echo "| 1. Update: apply every changeset | ${{ steps.update.outcome || 'not run' }} |"
            echo "| 2. Rollback: undo every changeset | ${{ steps.rollback.outcome || 'not run' }} |"
            echo "| 3. Update again: re-apply after rollback | ${{ steps.reapply.outcome || 'not run' }} |"
            echo "| 4. Tests: run every test case in schema/tests | ${{ steps.tests.outcome || 'not run' }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy to ${{ inputs.environment }}
    needs: lint
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'instance'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      # Read by pipelines/bin/liquibase
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT || '5432' }}
      DB_NAME: ${{ inputs.db_name }}
      DB_USER: ${{ inputs.db_owner }}
      DB_PASSWORD: ${{ secrets.DB_OWNER_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets are set
        run: |
          missing=0
          [ -n "$DB_HOST" ] || { echo "::error::Secret DB_HOST is not set in environment '${{ inputs.environment }}'"; missing=1; }
          [ -n "$DB_PASSWORD" ] || { echo "::error::Secret DB_OWNER_PASSWORD is not set in environment '${{ inputs.environment }}'"; missing=1; }
          exit $missing

      - name: Set up Liquibase
        run: |
          chmod +x pipelines/bin/liquibase
          echo "$GITHUB_WORKSPACE/pipelines/bin" >> "$GITHUB_PATH"
          docker pull --quiet "$LIQUIBASE_IMAGE"

      - name: "1. Show pending changesets"
        run: liquibase status --verbose

      - name: "2. Update: apply pending changesets"
        run: liquibase update
