# Lints, tests and deploys the schema changelog (schema/changelog.yaml) with Liquibase:
#
#   Lint ─► Test in ephemeral environment ─► Deploy to dev ─► Deploy to qa ─► Deploy to prod
#           (update, test rollback,           + unit tests     + unit tests
#            re-apply, unit tests)
#
# pull_request:       Lint and Test in ephemeral environment only. Nothing is deployed from a PR.
# push to main:       the whole pipeline, once the PR is merged.
# workflow_dispatch:  the whole pipeline when run on main; Lint and Test only on any other branch.
#
# Each stage waits for the one before it and is skipped if it fails. Deploys use the dev, qa and prod
# GitHub environments; see deploy-environment.yml for the secrets each one needs. Add required
# reviewers to the prod environment so production waits for an approval.
name: Deploy schema

on:
  pull_request:
    paths:
      - "schema/**"
      - "pipelines/bin/**"
      - "pipelines/test/**"
      - ".github/workflows/deploy-schema.yml"
      - ".github/workflows/deploy-environment.yml"
      - ".github/workflows/lint-schema.yml"
  push:
    branches: [main]
    paths:
      - "schema/**"
      - "pipelines/bin/**"
      - "pipelines/test/**"
      - ".github/workflows/deploy-schema.yml"
      - ".github/workflows/deploy-environment.yml"
      - ".github/workflows/lint-schema.yml"
  workflow_dispatch:

# One run at a time per branch, so two deploys never overlap. A queued run waits rather than cancelling.
concurrency:
  group: deploy-schema-${{ github.ref }}
  cancel-in-progress: false

env:
  LIQUIBASE_IMAGE: liquibase/liquibase:4.29

jobs:
  lint:
    name: Lint
    uses: ./.github/workflows/lint-schema.yml

  test:
    name: Test in ephemeral environment
    needs: lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: app_db
          POSTGRES_USER: app_user
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Read by pipelines/bin/liquibase
      DB_HOST: localhost
      DB_NAME: app_db
      DB_USER: app_user
      DB_PASSWORD: ci_only_password
      # Read by psql
      PGHOST: localhost
      PGDATABASE: app_db
      PGUSER: app_user
      PGPASSWORD: ci_only_password
    steps:
      - uses: actions/checkout@v4

      - name: "1. Initialize ephemeral test environment"
        id: init
        run: |
          pg_isready
          psql -tAc "SELECT version()"
          echo "Throwaway Postgres is ready. It is deleted when this job ends."

      - name: "2. Set up Liquibase"
        id: setup
        run: |
          chmod +x pipelines/bin/liquibase
          echo "$GITHUB_WORKSPACE/pipelines/bin" >> "$GITHUB_PATH"
          docker pull --quiet "$LIQUIBASE_IMAGE"

      - name: "3. Update change"
        id: update
        run: |
          liquibase update
          applied=$(psql -tAc "SELECT count(*) FROM databasechangelog")
          echo "applied=$applied" >> "$GITHUB_OUTPUT"
          echo "Applied $applied changesets"

      - name: "4. Test rollback"
        id: rollback
        run: |
          liquibase rollback-count --count=${{ steps.update.outputs.applied }}

          # Rolling everything back must leave an empty schema: no changesets recorded,
          # and no tables, views, indexes, sequences or routines left behind.
          remaining=$(psql -tAc "SELECT count(*) FROM databasechangelog")
          leftovers=$(psql -tAc "
            SELECT string_agg(name, ', ') FROM (
              SELECT c.relname AS name FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace
              WHERE n.nspname = 'public' AND c.relname NOT LIKE 'databasechangelog%'
              UNION ALL
              SELECT p.proname FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
              WHERE n.nspname = 'public'
            ) objects")
          if [ "$remaining" != 0 ] || [ -n "$leftovers" ]; then
            echo "::error::Rollback left $remaining changesets recorded and these objects behind: ${leftovers:-none}"
            exit 1
          fi
          echo "Rolled back ${{ steps.update.outputs.applied }} changesets; the schema is empty again"

      - name: "5. Re-apply change"
        id: reapply
        run: |
          liquibase update
          applied=$(psql -tAc "SELECT count(*) FROM databasechangelog")
          if [ "$applied" != "${{ steps.update.outputs.applied }}" ]; then
            echo "::error::Re-applied $applied changesets, expected ${{ steps.update.outputs.applied }}"
            exit 1
          fi
          echo "Re-applied $applied changesets"

      - name: "6. Unit tests (schema/tests)"
        id: tests
        run: bash pipelines/test/run-sql-tests.sh

      - name: Summary
        if: always()
        run: |
          {
            echo "### Test in ephemeral environment"
            echo "| Step | Result |"
            echo "|---|---|"
            echo "| Lint | ${{ needs.lint.result }} (risk level: ${{ needs.lint.outputs.risk-level }}) |"
            echo "| 1. Initialize ephemeral test environment | ${{ steps.init.outcome || 'not run' }} |"
            echo "| 2. Set up Liquibase | ${{ steps.setup.outcome || 'not run' }} |"
            echo "| 3. Update change | ${{ steps.update.outcome || 'not run' }} |"
            echo "| 4. Test rollback | ${{ steps.rollback.outcome || 'not run' }} |"
            echo "| 5. Re-apply change | ${{ steps.reapply.outcome || 'not run' }} |"
            echo "| 6. Unit tests (schema/tests) | ${{ steps.tests.outcome || 'not run' }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-dev:
    name: Deploy to dev
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: dev
      run-tests: true
    secrets: inherit

  deploy-qa:
    name: Deploy to qa
    needs: deploy-dev
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: qa
      run-tests: true
    secrets: inherit

  deploy-prod:
    name: Deploy to prod
    needs: deploy-qa
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: prod
      # The unit tests insert test data, so they don't run against production.
      run-tests: false
    secrets: inherit
