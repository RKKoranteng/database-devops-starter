# Schema changelog: applies the listed files to the application database, top to bottom.
#
# Only files listed here run. To add a change, create the file and add an include below it,
# keeping dependency order (sequences, tables, indexes, views, procedures, triggers).
# Liquibase records every applied changeset in DATABASECHANGELOG and skips it on later runs,
# so already-applied files stay in this list.
databaseChangeLog:
  # tables
  - include:
      file: tables/customers.sql
      relativeToChangelogFile: true
  - include:
      file: tables/orders.sql
      relativeToChangelogFile: true

  # indexes
  - include:
      file: indexes/idx_orders_customer_id.sql
      relativeToChangelogFile: true
  - include:
      file: indexes/idx_orders_status_created_at.sql
      relativeToChangelogFile: true

  # views
  - include:
      file: views/customer_order_summary.sql
      relativeToChangelogFile: true

  # procedures
  - include:
      file: procedures/place_order.sql
      relativeToChangelogFile: true

  # triggers
  - include:
      file: triggers/set_updated_at.sql
      relativeToChangelogFile: true
  - include:
      file: triggers/trg_customers_updated_at.sql
      relativeToChangelogFile: true
  - include:
      file: triggers/trg_orders_updated_at.sql
      relativeToChangelogFile: true
